# Publishes my personal openGym build to GitHub Pages — install it on iPhone from Safari
# (Share → Add to Home Screen).
#
# Pages serves static files only, so there is no backend: VITE_MOBILE=1 runs the app with no
# sign-in, everything stored on the phone (back it up with Settings → Export). VITE_PAGES=1
# keeps the service worker on for offline use. The exercise images and animated demos
# (~140 MB) are not committed here; they come from the upstream dataset on jsDelivr, pinned
# to a commit so the CDN and the browser can cache them for good.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DATASET: https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx vite build
        working-directory: frontend
        env:
          VITE_MOBILE: '1'
          VITE_PAGES: '1'
          VITE_IMG_BASE: ${{ env.DATASET }}/images/
          VITE_GIF_BASE: ${{ env.DATASET }}/videos/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
